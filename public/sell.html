<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sell • Hybrid Cryptoexchange</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', system-ui, sans-serif;
    }

    .gradient-bg {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0f2e 50%, #0f172a 100%);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .neon-text {
      background: linear-gradient(90deg, #22d3ee, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .order-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      margin-bottom: 10px;
      transition: all 0.2s;
    }
    .order-row:hover {
      background: rgba(255,255,255,0.1);
      transform: translateX(4px);
    }
  </style>
</head>
<body class="gradient-bg min-h-screen text-white">

<header class="border-b border-white/10 bg-black/40 backdrop-blur-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-gradient-to-br from-cyan-400 to-purple-600 rounded-xl flex items-center justify-center text-2xl font-bold">H</div>
      <h1 class="text-2xl font-bold tracking-tight neon-text">Hybrid Cryptoexchange</h1>
    </div>

    <nav class="flex items-center gap-8 text-sm font-medium">
      <a href="index.html" class="nav-link">Dashboard</a>
      <a href="market.html" class="nav-link">Markets</a>
      <a href="order.html" class="nav-link">Trade</a>
      <a href="sell.html" class="nav-link">Sell</a>
      <a href="portfolio.html" class="nav-link">Portfolio</a>
      <a href="account.html" class="nav-link">Account</a>
    </nav>

    <div id="auth-status" class="text-sm"></div>
  </div>
</header>

  <main class="max-w-7xl mx-auto px-6 py-8">
    <div class="mb-8">
      <h1 class="text-4xl font-bold mb-2">Sell Assets</h1>
      <p class="text-gray-400">Match with available buy orders or place your own sell order</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

      <!-- Available Buy Orders -->
      <div class="lg:col-span-7 glass-card rounded-3xl p-6">
        <h2 class="text-xl font-semibold mb-5 flex items-center gap-2">
          <i class="fas fa-arrow-up text-emerald-400"></i> Available Buy Orders
        </h2>
        <div id="buy-orders-list" class="orders-list min-h-[420px]">
          <p class="empty-state text-gray-400">Loading buy orders...</p>
        </div>
      </div>

      <!-- Place Sell Order -->
      <div class="lg:col-span-5 glass-card rounded-3xl p-8">
        <h2 class="text-2xl font-semibold mb-6 flex items-center gap-2">
          <i class="fas fa-arrow-down text-rose-400"></i> Place Sell Order
        </h2>

        <form id="sell-order-form" class="order-form space-y-6">
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Trading Pair</label>
            <input type="text" name="trading_pair" placeholder="BTC/USDT" required
                   class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-cyan-400 transition-colors text-lg">
          </div>

          <div class="grid grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-2">Price (USDT)</label>
              <input type="number" step="0.01" name="price" required
                     class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-cyan-400 transition-colors text-lg">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-2">Quantity</label>
              <input type="number" step="0.0001" name="quantity" required
                     class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-cyan-400 transition-colors text-lg">
            </div>
          </div>

          <button type="submit" 
                  class="w-full py-5 rounded-2xl bg-gradient-to-r from-rose-500 to-orange-600 hover:from-rose-400 hover:to-orange-500 font-semibold text-xl transition-all duration-300 shadow-lg shadow-rose-500/30">
            Place Sell Order
          </button>

          <p id="sell-order-message" class="message text-center text-sm min-h-[28px]"></p>
        </form>
      </div>

    </div>
  </main>

  <script src="app.js" defer></script>
<script>
  // Highlight current active page
  const currentPage = window.location.pathname.split("/").pop() || "index.html";
  document.querySelectorAll('.nav-link').forEach(link => {
    if (link.getAttribute('href') === currentPage) {
      link.classList.add('active');
    }
  });
</script>
</body>
</html>
