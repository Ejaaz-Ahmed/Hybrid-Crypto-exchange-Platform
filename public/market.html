<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markets • Hybrid Cryptoexchange</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', system-ui, sans-serif;
    }

    .gradient-bg {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0f2e 50%, #0f172a 100%);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .neon-text {
      background: linear-gradient(90deg, #22d3ee, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .price-up { color: #34d399; }
    .price-down { color: #f87171; }

    .market-row, .portfolio-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      margin-bottom: 10px;
      transition: all 0.2s;
    }
    .market-row:hover, .portfolio-row:hover {
      background: rgba(255,255,255,0.12);
      transform: translateX(4px);
    }
  </style>
</head>
<body class="gradient-bg min-h-screen text-white">

 <header class="border-b border-white/10 bg-black/40 backdrop-blur-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-gradient-to-br from-cyan-400 to-purple-600 rounded-xl flex items-center justify-center text-2xl font-bold">H</div>
      <h1 class="text-2xl font-bold tracking-tight neon-text">Hybrid Cryptoexchange</h1>
    </div>

    <nav class="flex items-center gap-8 text-sm font-medium">
      <a href="index.html" class="nav-link">Dashboard</a>
      <a href="market.html" class="nav-link">Markets</a>
      <a href="order.html" class="nav-link">Trade</a>
      <a href="sell.html" class="nav-link">Sell</a>
      <a href="portfolio.html" class="nav-link">Portfolio</a>
      <a href="account.html" class="nav-link">Account</a>
    </nav>

    <div id="auth-status" class="text-sm"></div>
  </div>
</header>

  <main class="max-w-7xl mx-auto px-6 py-8">
    <div class="mb-8">
      <h1 class="text-4xl font-bold mb-2">Market Center</h1>
      <p class="text-gray-400">Real-time prices, analytics &amp; order book</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

      <!-- Search Market -->
      <div class="lg:col-span-5 glass-card rounded-3xl p-6">
        <h2 class="text-xl font-semibold mb-5 flex items-center gap-2">
          <i class="fas fa-search text-cyan-400"></i> Search Market
        </h2>
        <form id="market-search-form" class="flex gap-3">
          <input id="market-pair" 
                 type="text" 
                 value="BTC/USDT"
                 class="flex-1 bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-cyan-400 text-lg font-medium"
                 placeholder="BTC/USDT" />
          <button id="market-button" 
                  type="submit"
                  class="px-10 bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 rounded-2xl font-semibold transition-all">
            Load
          </button>
        </form>
        <div id="market-results" class="mt-6"></div>
      </div>

      <!-- Live Price Feed -->
      <div class="lg:col-span-7 glass-card rounded-3xl p-6">
        <div class="flex justify-between items-center mb-5">
          <h2 class="text-xl font-semibold">Live Price Feed</h2>
          <span class="px-4 py-1 text-xs bg-emerald-500/20 text-emerald-400 rounded-full flex items-center gap-1.5">
            <span class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></span>LIVE
          </span>
        </div>
        <div id="market-table" class="min-h-[300px]"></div>
      </div>

      <!-- Market Analytics -->
      <div class="lg:col-span-7 glass-card rounded-3xl p-6">
        <h2 class="text-xl font-semibold mb-5">Market Analytics</h2>
        <div id="analytics-cards" class="min-h-[280px]"></div>
      </div>

      <!-- Order Book -->
      <div class="lg:col-span-5 glass-card rounded-3xl p-6">
        <h2 class="text-xl font-semibold mb-5">Order Book Snapshot</h2>
        <div id="orderbook-section" class="min-h-[280px]"></div>
      </div>

    </div>
  </main>

  <script src="app.js" defer></script>

  <!-- Global Safety Functions removed to use app.js -->
  <script>
  // Highlight current page
  const currentPage = window.location.pathname.split("/").pop() || "index.html";
  document.querySelectorAll('.nav-link').forEach(link => {
    if (link.getAttribute('href') === currentPage) {
      link.classList.add('active');
    }
  });
</script>
</body>
</html>
