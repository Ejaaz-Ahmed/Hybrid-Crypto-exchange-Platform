<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login • EAA Exchange</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', system-ui, sans-serif;
    }

    .gradient-bg {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0f2e 50%, #0f172a 100%);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .neon-text {
      background: linear-gradient(90deg, #22d3ee, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="gradient-bg min-h-screen text-white">

  <!-- Consistent Header -->
<header class="border-b border-white/10 bg-black/40 backdrop-blur-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div><img src="Logo.png" alt="EAA Logo" class="h-9 w-auto"></div>
      <h1 class="text-2xl font-bold tracking-tight neon-text">EAA Exchange</h1>
    </div>

    <nav class="flex items-center gap-8 text-sm font-medium">
      <a href="index.html" class="nav-link">Dashboard</a>
      <a href="market.html" class="nav-link">Markets</a>
      <a href="order.html" class="nav-link">Trade</a>
      <a href="sell.html" class="nav-link">Sell</a>
      <a href="portfolio.html" class="nav-link">Portfolio</a>
      <a href="account.html" class="nav-link">Account</a>
    </nav>

    <div id="auth-status" class="text-sm"></div>
  </div>
</header>

  <main class="flex items-center justify-center min-h-[calc(100vh-80px)] p-6">
    <div class="max-w-md w-full">
      <div class="glass-card rounded-3xl p-8 shadow-2xl shadow-purple-500/10">
        
        <div class="text-center mb-8">
          <div class="mx-auto w-16 h-16 bg-gradient-to-br from-cyan-400 to-purple-600 rounded-2xl flex items-center justify-center mb-4">
            <i class="fas fa-sign-in-alt text-3xl"></i>
          </div>
          <h2 class="text-3xl font-semibold">Welcome Back</h2>
          <p class="text-gray-400 mt-2">Sign in to access your trading account</p>
        </div>

        <form id="login-form" class="auth-form space-y-6">
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
            <input type="email" name="email" required
                   class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-cyan-400 transition-colors text-lg"
                   placeholder="you@example.com" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
            <input type="password" name="password" required
                   class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-cyan-400 transition-colors text-lg" />
          </div>

          <div class="flex items-center justify-between text-sm">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="w-4 h-4 accent-cyan-400" />
              <span class="text-gray-400">Remember me</span>
            </label>
            <a href="#" class="text-cyan-400 hover:underline">Forgot password?</a>
          </div>

          <button type="submit" 
                  class="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 font-semibold text-lg transition-all duration-300 shadow-lg shadow-cyan-500/30">
            Sign In Securely
          </button>

          <p id="login-message" class="message text-center text-sm min-h-[24px]"></p>
        </form>

        <div class="text-center mt-8">
          <p class="text-gray-400 text-sm">
            Don't have an account? 
            <a href="register.html" class="text-cyan-400 hover:underline font-medium">Create one now</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js" defer></script>
  <script>
  // Highlight current page
  const currentPage = window.location.pathname.split("/").pop() || "index.html";
  document.querySelectorAll('.nav-link').forEach(link => {
    if (link.getAttribute('href') === currentPage) {
      link.classList.add('active');
    }
  });
</script>
</body>
</html>
